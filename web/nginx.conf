server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (React Router). Sadece dosya var mı diye bakılır; $uri/
  # kullanılmaz, aksi halde /setup gibi rotalar 301 ile dizine yönlenir.
  location / {
    try_files $uri /index.html;
  }

  # API uç noktaları (ters vekil). SPA rotaları (/setup, /dashboard, ...) etkilenmez.
  location ~ ^/(setup/(status|presets|initialize)|auth/(login|me)|health|terms|classes|courses|rooms|users|teachers|students|attendance|schedule|mock-exams)($|/) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Swagger UI
  location /docs {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location = /openapi.yaml {
    proxy_pass http://api:3000;
  }
}
